server {
    listen 80;
    server_name gestionale.tantotango.it localhost 127.0.0.1;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 80 default_server;
    server_name _;
    return 301 https://gestionale.tantotango.it$request_uri;
}
