version: '3.8'

services:
  # Backend Django (API)
  backend:
    build: .
    command: >
      sh -c "python manage.py migrate &&
             gunicorn wamanager.wsgi:application --bind 0.0.0.0:8000"
    ports:
      - "8082:8000"
    environment:
      # If you want to use Postgres, change this to a postgres:// URL
      - DATABASE_URL=sqlite:////app/db.sqlite3
      - GATEWAY_BASE_URL=http://gateway:4002
    volumes:
      - ./db.sqlite3:/app/db.sqlite3
    restart: always

  # Worker Django-Q (Per operazioni in background / sondaggi programmati)
  worker:
    build: .
    command: python manage.py qcluster
    environment:
      - DATABASE_URL=sqlite:////app/db.sqlite3
      - GATEWAY_BASE_URL=http://gateway:4002
    volumes:
      - ./db.sqlite3:/app/db.sqlite3
    restart: always

  # WhatsApp Gateway (Node.js)
  gateway:
    build: ./wa-gateway
    ports:
      - "4002:4002"
    volumes:
      - wa_session_data:/app/baileys_auth_info
    restart: always

  # Frontend Web (Flutter)
  frontend:
    build:
      context: ./flutter_app
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    restart: always

volumes:
  wa_session_data:
